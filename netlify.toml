[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev -- --port 5173"
  targetPort = 5173
  port = 8888

# The old WordPress Profile page is replaced by Our Team.
[[redirects]]
  from = "/profile"
  to = "/our-team/"
  status = 301

[[redirects]]
  from = "/profile/"
  to = "/our-team/"
  status = 301

# Every public route is pre-generated as /<route>/index.html, so existing files are served first.
# Anything else gets the branded 404 page with a real 404 status.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
